name: NSE Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install pandas yfinance

      - run: python scanner.py

      - name: Commit output
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add output.csv
          git commit -m "update"
          git push
